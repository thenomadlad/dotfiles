# Throwaway Arch VM for testing these dotfiles without touching the host.
# Build: mkosi -C vm build    Run: vm/run.sh    (see vm/README.md)

[Distribution]
Distribution=arch

[Output]
Format=disk
ImageId=dotfiles-vm
OutputDirectory=mkosi.output

[Build]
CacheDirectory=mkosi.cache

[Content]
Bootable=yes
WithDocs=no
RootPassword=root
# Pre-answer systemd-firstboot so the guest doesn't stop to prompt on every fresh boot.
# C.UTF-8 ships prebuilt with glibc, so no locale-gen is needed.
Locale=C.UTF-8
Keymap=us
Timezone=America/Los_Angeles
Hostname=dotfiles-vm
Packages=
        base
        linux
        sudo
        zsh
        stow
        git
        neovim
        mesa
        libnotify
        pipewire
        wireplumber
        pipewire-pulse
        noto-fonts
        ttf-jetbrains-mono-nerd
        wezterm
        nautilus
        hyprland
        hyprlauncher
        hyprshutdown
        xdg-desktop-portal-hyprland
        waybar
        mako
        hyprlock
        hypridle
        hyprpolkitagent
        playerctl
        qt6-wayland
