# Ctrl-h/j/k/l move between panes; inside nvim, Navigator.nvim takes the keys and hands back at the edge
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# WezTerm sends these for Ctrl+Alt+% and Ctrl+Alt+" over ssh. zsh takes them and splits with the
# typed line (_spawn_line in .zshrc); any other program in the pane gets a plain split instead.
set -s user-keys[0] "\e[37;7~"
set -s user-keys[1] "\e[34;7~"
bind -n User0 if-shell -F "#{==:#{pane_current_command},zsh}" "send-keys -H 1b 5b 33 37 3b 37 7e" "split-window -h -c '#{pane_current_path}'"
bind -n User1 if-shell -F "#{==:#{pane_current_command},zsh}" "send-keys -H 1b 5b 33 34 3b 37 7e" "split-window -v -c '#{pane_current_path}'"

# Splits open in the current pane's directory, like WezTerm's
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Tokyo Night bar with rounded Nerd Font pills ( and  are the round ends);
# the session pill turns orange while the prefix is down
set -g status-position top
set -g status-style "bg=#1a1b26,fg=#565f89"
set -g status-left-length 40
set -g status-left "#[fg=#{?client_prefix,#ff9e64,#7aa2f7},bg=#1a1b26]#[fg=#1a1b26,bg=#{?client_prefix,#ff9e64,#7aa2f7},bold] #S #[fg=#{?client_prefix,#ff9e64,#7aa2f7},bg=#1a1b26,nobold] "
set -g status-right "#[fg=#292e42,bg=#1a1b26]#[fg=#7dcfff,bg=#292e42] #h #[fg=#292e42,bg=#1a1b26]"
set -g window-status-separator ""
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#292e42,bg=#1a1b26]#[fg=#c0caf5,bg=#292e42,bold]#I #W#[fg=#292e42,bg=#1a1b26,nobold]"
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "fg=#7dcfff,bg=#292e42"
set -g mode-style "fg=#c0caf5,bg=#283457"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10  # no lag on Esc in nvim

# Pass WezTerm's true color through so nvim themes look right
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Let programs in panes (nvim over ssh) set the Mac clipboard through OSC 52
set -g set-clipboard on
# Pass clickable OSC 8 links through to WezTerm
set -as terminal-features ",xterm*:hyperlinks"
